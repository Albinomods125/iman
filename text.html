<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iman social</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #16181c;
            --border: #2f3336;
            --primary: #1d9bf0;
            --admin-color: #ffd700;
            --danger: #f4212e;
            --success: #00ba7c;
            --text: #e7e9ea;
            --text-gray: #71767b;
            --comment-bg: #202327;
            --reply-bg: #1a1d21;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

        /* --- LOGIN --- */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 350px; text-align: center; }
        .auth-logo { font-size: 3rem; color: var(--text); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-label { color: var(--text-gray); font-size: 0.8rem; margin-bottom: 5px; display: block; }
        .input-field { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px; color: var(--text); border-radius: 4px; font-size: 1rem; outline: none; }
        .btn-primary { width: 100%; background: var(--text); color: black; border: none; padding: 12px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .switch-auth { margin-top: 20px; color: var(--primary); cursor: pointer; font-size: 0.9rem; }

        /* --- LAYOUT --- */
        #app-screen { display: none; }
        header { position: fixed; top: 0; width: 100%; height: 55px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; backdrop-filter: blur(10px); z-index: 100; }
        .header-title { font-weight: 700; font-size: 1.2rem; }
        .logout-btn { color: var(--text-gray); cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { font-size: 1.5rem; color: var(--text-gray); cursor: pointer; padding: 10px; }
        .nav-item.active { color: var(--text); }
        .page { padding-top: 60px; display: none; }
        .page.active { display: block; }

        /* --- POSTS --- */
        .create-post-area { border-bottom: 1px solid var(--border); padding: 15px; }
        .cp-header { display: flex; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #333; }
        .cp-input { width: 100%; background: transparent; border: none; color: var(--text); font-size: 1.1rem; resize: none; outline: none; min-height: 50px; }
        .cp-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .post-btn-small { background: var(--primary); color: white; border: none; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .media-options { display: flex; gap: 15px; margin-top: 10px; }
        .media-btn { color: var(--primary); cursor: pointer; font-size: 0.9rem; }

        .post { border-bottom: 1px solid var(--border); padding: 15px; display: flex; gap: 10px; animation: fadeIn 0.3s; position: relative; }
        .post-content { width: 100%; }
        .post-header { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .p-name { font-weight: 700; }
        .p-username { color: var(--text-gray); font-size: 0.9rem; }
        .admin-badge { color: var(--admin-color); font-size: 0.9rem; margin-left: 5px; }
        .p-text { margin-bottom: 10px; line-height: 1.4; white-space: pre-wrap; }
        .p-image { width: 100%; border-radius: 12px; margin-top: 5px; border: 1px solid var(--border); display: block; }
        .p-video { width: 100%; border-radius: 12px; margin-top: 5px; border: 1px solid var(--border); display: block; }
        .p-actions { display: flex; justify-content: space-between; margin-top: 10px; max-width: 350px; }
        .act-btn { color: var(--text-gray); cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .act-btn.liked { color: #f91880; }
        .delete-btn { position: absolute; top: 15px; right: 15px; color: var(--danger); cursor: pointer; font-size: 0.9rem; display: none; }

        /* --- COMENTÁRIOS MELHORADOS --- */
        .comments-section { display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border); }
        .comments-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .comments-count { font-size: 0.9rem; color: var(--text-gray); }
        .comments-list { max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
        
        .comment-item { display: flex; gap: 10px; margin-bottom: 12px; position: relative; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .comment-bubble { background: var(--comment-bg); padding: 8px 12px; border-radius: 16px; border-top-left-radius: 2px; max-width: 85%; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .c-author { font-weight: bold; font-size: 0.85rem; margin-right: 5px; }
        .c-text { font-size: 0.95rem; line-height: 1.3; }
        .c-actions { display: flex; gap: 10px; margin-top: 5px; font-size: 0.8rem; }
        .c-action-btn { color: var(--text-gray); cursor: pointer; }
        .c-action-btn:hover { color: var(--primary); }
        .c-delete { color: var(--text-gray); font-size: 0.8rem; cursor: pointer; margin-left: 10px; }
        .c-delete:hover { color: var(--danger); }
        
        .comment-input-wrapper { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        .c-input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 8px 15px; border-radius: 20px; color: var(--text); outline: none; }
        .c-submit { color: var(--primary); font-weight: bold; background: none; border: none; cursor: pointer; }
        
        /* --- RESPOSTAS A COMENTÁRIOS --- */
        .replies-section { margin-top: 8px; padding-left: 42px; }
        .reply-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .reply-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .reply-bubble { background: var(--reply-bg); padding: 6px 10px; border-radius: 12px; border-top-left-radius: 2px; max-width: 85%; }
        .reply-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .r-author { font-weight: bold; font-size: 0.8rem; margin-right: 5px; }
        .r-text { font-size: 0.9rem; line-height: 1.3; }
        .r-actions { display: flex; gap: 8px; margin-top: 3px; font-size: 0.75rem; }
        .r-action-btn { color: var(--text-gray); cursor: pointer; }
        .r-action-btn:hover { color: var(--primary); }
        .r-delete { color: var(--text-gray); font-size: 0.75rem; cursor: pointer; margin-left: 8px; }
        .r-delete:hover { color: var(--danger); }
        
        .reply-input-wrapper { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .r-input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 16px; color: var(--text); outline: none; font-size: 0.9rem; }
        .r-submit { color: var(--primary); font-weight: bold; background: none; border: none; cursor: pointer; font-size: 0.9rem; }
        
        .toggle-replies { color: var(--primary); font-size: 0.8rem; cursor: pointer; margin-top: 5px; }
        .toggle-replies:hover { text-decoration: underline; }

        /* --- PERFIL --- */
        .profile-header { padding: 15px; border-bottom: 1px solid var(--border); }
        .big-avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--bg); object-fit: cover;}
        .edit-profile-btn { border: 1px solid var(--text-gray); background: transparent; color: var(--text); padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-right: 10px; }
        .follow-btn { background: var(--primary); color: white; border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .unfollow-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .stats-row { display: flex; gap: 15px; margin: 15px 0; font-size: 0.9rem; }
        .stat { text-align: center; }
        .stat-number { font-weight: bold; display: block; }
        .stat-label { color: var(--text-gray); font-size: 0.8rem; }

        /* --- EDITAR --- */
        .edit-container { padding: 20px; }
        .edit-avatar-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .edit-avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--surface); margin-bottom: 10px; }
        .upload-text { color: var(--primary); font-size: 0.9rem; cursor: pointer; }
        .btn-save { width: 100%; background: var(--text); color: black; border: none; padding: 12px; border-radius: 25px; font-weight: bold; margin-top: 20px; cursor: pointer; }

        /* --- BUSCA --- */
        .search-bar-container { padding: 10px 15px; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; background: var(--surface); border: none; padding: 10px 20px; border-radius: 20px; color: var(--text); outline: none; }
        .user-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px; }

        /* --- ADMIN --- */
        .admin-container { padding: 15px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .admin-table th { background: var(--surface); color: var(--text-gray); font-weight: 600; }
        .delete-account-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        /* --- CÂMERA --- */
        .camera-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .camera-container { width: 100%; max-width: 500px; background: var(--surface); border-radius: 12px; padding: 20px; }
        #camera-preview { width: 100%; border-radius: 8px; background: #000; }
        .camera-controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .camera-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .camera-btn.cancel { background: var(--danger); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        #fileInput, #avatarUpload, #videoInput { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-logo"><i class="fas fa-comments"></i></div>
        <div class="auth-box">
            <h2 id="auth-title" style="margin-bottom: 20px;">Entrar</h2>
            <div class="input-group" id="group-name" style="display:none;">
                <label class="input-label">Nome Completo</label>
                <input type="text" id="reg-name" class="input-field" placeholder="Seu Nome">
            </div>
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" id="email" class="input-field" placeholder="exemplo@gmail.com">
            </div>
            <div class="input-group">
                <label class="input-label">Senha</label>
                <input type="password" id="password" class="input-field" placeholder="******">
            </div>
            <button class="btn-primary" onclick="auth.submit()">Entrar</button>
            <div class="switch-auth" onclick="auth.toggleMode()">Não tem conta? Cadastre-se</div>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="user-avatar" id="header-avatar" onclick="nav.goto('profile', db.currentUser.id)"></div>
            <div class="header-title" id="page-title">Início</div>
            <div class="logout-btn" onclick="auth.logout()"><i class="fas fa-sign-out-alt"></i></div>
        </header>

        <div id="home-page" class="page active">
            <div class="create-post-area">
                <div class="cp-header">
                    <img src="" class="user-avatar" id="cp-avatar">
                    <textarea id="post-text" class="cp-input" placeholder="No que você está pensando?"></textarea>
                </div>
                <div id="preview-container" style="display:none; margin-top:10px;">
                    <img id="image-preview" style="width:100%; border-radius:10px; display:none;">
                    <video id="video-preview" style="width:100%; border-radius:10px; display:none;" controls></video>
                </div>
                <div class="cp-actions">
                    <div class="media-options">
                        <label for="fileInput" style="cursor:pointer; color:var(--primary);"><i class="far fa-image"></i> Foto</label>
                        <label for="videoInput" style="cursor:pointer; color:var(--primary);"><i class="fas fa-video"></i> Vídeo</label>
                        <div style="cursor:pointer; color:var(--primary);" onclick="app.openCamera()"><i class="fas fa-camera"></i> Câmera</div>
                        <input type="file" id="fileInput" accept="image/*" onchange="app.handleImage(this)">
                        <input type="file" id="videoInput" accept="video/*" onchange="app.handleVideo(this)">
                    </div>
                    <button class="post-btn-small" onclick="app.createPost()">Postar</button>
                </div>
            </div>
            <div id="feed-list"></div>
        </div>

        <div id="search-page" class="page">
            <div class="search-bar-container">
                <input type="text" class="search-input" placeholder="Buscar usuários..." oninput="app.searchUsers(this.value)">
            </div>
            <div id="search-results"></div>
        </div>

        <div id="profile-page" class="page">
            <div id="profile-content"></div>
            <div class="section-divider" style="padding:15px; font-weight:bold; border-bottom:1px solid var(--border)">Postagens</div>
            <div id="profile-posts"></div>
        </div>

        <div id="edit-profile-page" class="page">
            <div class="edit-container">
                <div class="edit-avatar-wrapper">
                    <img src="" id="edit-preview" class="edit-avatar-preview">
                    <label for="avatarUpload" class="upload-text">Alterar Foto</label>
                    <input type="file" id="avatarUpload" accept="image/*" onchange="app.handleAvatarUpload(this)">
                </div>
                <div class="input-group"><label class="input-label">Nome</label><input type="text" id="edit-name" class="input-field"></div>
                <div class="input-group"><label class="input-label">Email</label><input type="email" id="edit-email" class="input-field"></div>
                <div class="input-group"><label class="input-label">Nova Senha</label><input type="text" id="edit-password" class="input-field" placeholder="Mantenha vazio para não mudar"></div>
                <button class="btn-save" onclick="app.saveProfile()">Salvar Alterações</button>
            </div>
        </div>

        <div id="admin-page" class="page">
            <div class="admin-container">
                <h2 style="margin-bottom: 20px;">Painel Administrativo</h2>
                <div style="margin-bottom: 15px; color: var(--text-gray);">Total de usuários: <span id="total-users">0</span></div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Senha</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-list">
                    </tbody>
                </table>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="nav.goto('home')"><i class="fas fa-home"></i></div>
            <div class="nav-item" onclick="nav.goto('search')"><i class="fas fa-search"></i></div>
            <div class="nav-item" onclick="nav.goto('profile', db.currentUser.id)"><i class="far fa-user"></i></div>
            <div class="nav-item" id="admin-nav" style="display:none;" onclick="nav.goto('admin')"><i class="fas fa-cog"></i></div>
        </nav>
    </div>

    <!-- Modal da Câmera -->
    <div class="camera-modal" id="camera-modal">
        <div class="camera-container">
            <video id="camera-preview" autoplay></video>
            <div class="camera-controls">
                <button class="camera-btn cancel" onclick="app.closeCamera()">Cancelar</button>
                <button class="camera-btn" onclick="app.capturePhoto()">Tirar Foto</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "albinomodz@gmail.com";

        // --- DATABASE ---
        const db = {
            users: [], posts: [], currentUser: null,
            init: function() {
                if (!localStorage.getItem('connect_users')) { this.seedData(); } 
                else {
                    this.users = JSON.parse(localStorage.getItem('connect_users'));
                    this.posts = JSON.parse(localStorage.getItem('connect_posts'));
                }
            },
            save: function() {
                localStorage.setItem('connect_users', JSON.stringify(this.users));
                localStorage.setItem('connect_posts', JSON.stringify(this.posts));
            },
            seedData: function() {
                this.users = [
                    { 
                        id: 1, 
                        name: "Admin Albino", 
                        email: ADMIN_EMAIL, 
                        password: "admin", 
                        avatar: "https://ui-avatars.com/api/?name=Admin&background=ffd700&color=000", 
                        followers: [], 
                        following: [],
                        isAdmin: true
                    }
                ];
                this.posts = [{ id: 101, userId: 1, text: "Bem-vindo ao Connect Pro!", image: null, video: null, likes: [], comments: [], date: Date.now() }];
                this.save();
            }
        };

        // --- AUTH ---
        const auth = {
            isLoginMode: true,
            checkSession: function() {
                const sessionID = localStorage.getItem('connect_session');
                if (sessionID) {
                    const user = db.users.find(u => u.id == sessionID);
                    if (user) { db.currentUser = user; this.enterApp(); return; }
                }
                document.getElementById('auth-screen').style.display = 'flex';
            },
            toggleMode: function() {
                this.isLoginMode = !this.isLoginMode;
                document.getElementById('auth-title').innerText = this.isLoginMode ? "Entrar" : "Criar Conta";
                document.querySelector('.switch-auth').innerText = this.isLoginMode ? "Não tem conta? Cadastre-se" : "Já tem conta? Entrar";
                document.getElementById('group-name').style.display = this.isLoginMode ? "none" : "block";
            },
            submit: function() {
                const emailVal = document.getElementById('email').value.trim().toLowerCase();
                const passVal = document.getElementById('password').value;
                const nameVal = document.getElementById('reg-name').value.trim();
                if (!emailVal || !passVal) return alert("Preencha email e senha!");

                if (this.isLoginMode) {
                    const user = db.users.find(u => u.email === emailVal && u.password === passVal);
                    if (user) { db.currentUser = user; this.saveSession(user.id); this.enterApp(); } 
                    else { alert("Dados incorretos."); }
                } else {
                    if (!nameVal) return alert("Preencha seu nome!");
                    if (db.users.find(u => u.email === emailVal)) return alert("Email já usado!");
                    const newUser = { 
                        id: Date.now(), 
                        name: nameVal, 
                        email: emailVal, 
                        password: passVal, 
                        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(nameVal)}&background=random`, 
                        followers: [], 
                        following: [],
                        isAdmin: false
                    };
                    db.users.push(newUser); db.save(); db.currentUser = newUser;
                    this.saveSession(newUser.id); this.enterApp();
                }
            },
            saveSession: function(id) { localStorage.setItem('connect_session', id); },
            enterApp: function() { 
                document.getElementById('auth-screen').style.display = 'none'; 
                document.getElementById('app-screen').style.display = 'block'; 
                app.loadUserData(); 
                app.renderFeed(); 
                
                // Mostrar botão admin se for admin
                if (app.isAdmin()) {
                    document.getElementById('admin-nav').style.display = 'block';
                }
            },
            logout: function() { localStorage.removeItem('connect_session'); db.currentUser = null; location.reload(); }
        };

        // --- APP ---
        const app = {
            tempImage: null, 
            tempVideo: null,
            tempAvatar: null,
            stream: null,
            
            loadUserData: function() {
                document.getElementById('header-avatar').style.backgroundImage = `url(${db.currentUser.avatar})`;
                document.getElementById('header-avatar').style.backgroundSize = 'cover';
                document.getElementById('cp-avatar').src = db.currentUser.avatar;
            },
            
            handleImage: function(input) {
                const file = input.files[0];
                if (file) { 
                    const reader = new FileReader(); 
                    reader.onloadend = function() { 
                        app.tempImage = reader.result; 
                        app.tempVideo = null;
                        document.getElementById('image-preview').src = reader.result; 
                        document.getElementById('image-preview').style.display = 'block';
                        document.getElementById('video-preview').style.display = 'none';
                        document.getElementById('preview-container').style.display = 'block'; 
                    }; 
                    reader.readAsDataURL(file); 
                }
            },
            
            handleVideo: function(input) {
                const file = input.files[0];
                if (file) { 
                    app.tempVideo = URL.createObjectURL(file);
                    app.tempImage = null;
                    document.getElementById('video-preview').src = app.tempVideo;
                    document.getElementById('video-preview').style.display = 'block';
                    document.getElementById('image-preview').style.display = 'none';
                    document.getElementById('preview-container').style.display = 'block';
                }
            },
            
            handleAvatarUpload: function(input) {
                const file = input.files[0];
                if (file) { const reader = new FileReader(); reader.onloadend = function() { app.tempAvatar = reader.result; document.getElementById('edit-preview').src = reader.result; }; reader.readAsDataURL(file); }
            },
            
            openCamera: function() {
                const modal = document.getElementById('camera-modal');
                const video = document.getElementById('camera-preview');
                
                modal.style.display = 'flex';
                
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(stream) {
                        app.stream = stream;
                        video.srcObject = stream;
                    })
                    .catch(function(err) {
                        alert("Erro ao acessar a câmera: " + err.message);
                        app.closeCamera();
                    });
            },
            
            closeCamera: function() {
                const modal = document.getElementById('camera-modal');
                const video = document.getElementById('camera-preview');
                
                if (app.stream) {
                    app.stream.getTracks().forEach(track => track.stop());
                    app.stream = null;
                }
                
                modal.style.display = 'none';
                video.srcObject = null;
            },
            
            capturePhoto: function() {
                const video = document.getElementById('camera-preview');
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                app.tempImage = canvas.toDataURL('image/png');
                app.tempVideo = null;
                
                document.getElementById('image-preview').src = app.tempImage;
                document.getElementById('image-preview').style.display = 'block';
                document.getElementById('video-preview').style.display = 'none';
                document.getElementById('preview-container').style.display = 'block';
                
                this.closeCamera();
            },
            
            createPost: function() {
                const text = document.getElementById('post-text').value;
                if (!text && !this.tempImage && !this.tempVideo) return;
                
                const newPost = { 
                    id: Date.now(), 
                    userId: db.currentUser.id, 
                    text: text, 
                    image: this.tempImage, 
                    video: this.tempVideo,
                    likes: [], 
                    comments: [], 
                    date: Date.now() 
                };
                
                db.posts.unshift(newPost); 
                db.save();
                
                document.getElementById('post-text').value = ''; 
                this.tempImage = null;
                this.tempVideo = null;
                document.getElementById('preview-container').style.display = 'none'; 
                app.renderFeed();
            },
            
            deletePost: function(postId) {
                if (confirm("Apagar post?")) { db.posts = db.posts.filter(p => p.id !== postId); db.save(); this.renderFeed(); }
            },
            
            toggleComments: function(postId) {
                const s = document.getElementById(`comments-${postId}`);
                if (s.style.display === 'none' || s.style.display === '') {
                    s.style.display = 'block';
                    s.style.animation = 'slideDown 0.3s ease-out';
                } else {
                    s.style.display = 'none';
                }
            },
            
            addComment: function(postId) {
                const input = document.getElementById(`input-comment-${postId}`);
                if (!input.value.trim()) return;
                const post = db.posts.find(p => p.id === postId);
                if (!post.comments) post.comments = [];
                post.comments.push({ 
                    id: Date.now(), 
                    userId: db.currentUser.id, 
                    text: input.value.trim(), 
                    date: Date.now(),
                    replies: [] 
                });
                db.save(); 
                input.value = '';
                this.renderFeed();
            },
            
            deleteComment: function(postId, commentId) {
                const post = db.posts.find(p => p.id === postId);
                post.comments = post.comments.filter(c => c.id !== commentId);
                db.save(); this.renderFeed();
            },
            
            addReply: function(postId, commentId) {
                const input = document.getElementById(`input-reply-${commentId}`);
                if (!input.value.trim()) return;
                const post = db.posts.find(p => p.id === postId);
                const comment = post.comments.find(c => c.id === commentId);
                if (!comment.replies) comment.replies = [];
                comment.replies.push({ 
                    id: Date.now(), 
                    userId: db.currentUser.id, 
                    text: input.value.trim(), 
                    date: Date.now()
                });
                db.save(); 
                input.value = '';
                this.renderFeed();
            },
            
            deleteReply: function(postId, commentId, replyId) {
                const post = db.posts.find(p => p.id === postId);
                const comment = post.comments.find(c => c.id === commentId);
                comment.replies = comment.replies.filter(r => r.id !== replyId);
                db.save(); this.renderFeed();
            },
            
            toggleReplies: function(commentId) {
                const s = document.getElementById(`replies-${commentId}`);
                if (s.style.display === 'none' || s.style.display === '') {
                    s.style.display = 'block';
                } else {
                    s.style.display = 'none';
                }
            },
            
            toggleLike: function(postId) {
                const post = db.posts.find(p => p.id === postId);
                const uid = db.currentUser.id;
                if (post.likes.includes(uid)) post.likes = post.likes.filter(id => id !== uid); else post.likes.push(uid);
                db.save(); this.renderFeed();
            },
            
            toggleFollow: function(userId) {
                const currentUserId = db.currentUser.id;
                const user = db.users.find(u => u.id === userId);
                const currentUser = db.users.find(u => u.id === currentUserId);
                
                if (user.followers.includes(currentUserId)) {
                    // Unfollow
                    user.followers = user.followers.filter(id => id !== currentUserId);
                    currentUser.following = currentUser.following.filter(id => id !== userId);
                } else {
                    // Follow
                    user.followers.push(currentUserId);
                    currentUser.following.push(userId);
                }
                
                db.save();
                db.currentUser = currentUser;
                
                // Atualizar a página do perfil se estiver nela
                if (document.getElementById('profile-page').classList.contains('active')) {
                    nav.renderProfile(userId);
                }
            },
            
            isFollowing: function(userId) {
                return db.currentUser.following.includes(userId);
            },
            
            downloadImage: function(base64) {
                const a = document.createElement("a"); a.href = base64; a.download = "imagem.png"; a.click();
            },
            
            isAdmin: function() { 
                return db.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || db.currentUser.isAdmin;
            },
            
            deleteUserAccount: function(userId) {
                if (!confirm("Tem certeza que deseja excluir esta conta? Esta ação não pode ser desfeita.")) return;
                
                if (userId === db.currentUser.id) {
                    alert("Você não pode excluir sua própria conta enquanto está logado.");
                    return;
                }
                
                // Remover usuário
                db.users = db.users.filter(u => u.id !== userId);
                
                // Remover posts do usuário
                db.posts = db.posts.filter(p => p.userId !== userId);
                
                // Remover de seguidores/seguindo de outros usuários
                db.users.forEach(user => {
                    user.followers = user.followers.filter(id => id !== userId);
                    user.following = user.following.filter(id => id !== userId);
                });
                
                db.save();
                
                // Recarregar lista de usuários admin
                if (document.getElementById('admin-page').classList.contains('active')) {
                    this.renderAdminPanel();
                }
                
                alert("Conta excluída com sucesso!");
            },
            
            openEditProfile: function() {
                const user = db.currentUser; document.getElementById('edit-name').value = user.name;
                document.getElementById('edit-email').value = user.email; document.getElementById('edit-password').value = "";
                document.getElementById('edit-preview').src = user.avatar; this.tempAvatar = null; nav.goto('edit-profile');
            },
            
            saveProfile: function() {
                const newName = document.getElementById('edit-name').value.trim(); const newEmail = document.getElementById('edit-email').value.trim(); const newPass = document.getElementById('edit-password').value.trim();
                if(!newName || !newEmail) return alert("Campos obrigatórios!");
                const userIndex = db.users.findIndex(u => u.id === db.currentUser.id);
                db.users[userIndex].name = newName; db.users[userIndex].email = newEmail;
                if(newPass) db.users[userIndex].password = newPass;
                if(this.tempAvatar) db.users[userIndex].avatar = this.tempAvatar;
                db.save(); db.currentUser = db.users[userIndex]; this.loadUserData(); alert("Salvo!"); nav.goto('profile', db.currentUser.id);
            },
            
            renderAdminPanel: function() {
                document.getElementById('total-users').textContent = db.users.length;
                
                const container = document.getElementById('admin-users-list');
                container.innerHTML = '';
                
                db.users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name} ${user.isAdmin ? '<i class="fas fa-crown admin-badge"></i>' : ''}</td>
                        <td>${user.email}</td>
                        <td>${user.password}</td>
                        <td>
                            ${!user.isAdmin ? `<button class="delete-account-btn" onclick="app.deleteUserAccount(${user.id})">Excluir</button>` : 'Admin'}
                        </td>
                    `;
                    container.appendChild(row);
                });
            },

            renderFeed: function() {
                const container = document.getElementById('feed-list'); container.innerHTML = '';
                db.posts.forEach(post => {
                    const author = db.users.find(u => u.id === post.userId); if (!author) return;
                    const isLiked = post.likes.includes(db.currentUser.id);
                    const showDelete = (this.isAdmin() || post.userId === db.currentUser.id) ? 'block' : 'none';
                    const badge = (author.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || author.isAdmin) ? `<i class="fas fa-certificate admin-badge"></i>` : '';
                    
                    let commentsHtml = '';
                    let totalComments = 0;
                    
                    if (post.comments && post.comments.length > 0) {
                        totalComments = post.comments.length;
                        post.comments.forEach(c => {
                            const cAuthor = db.users.find(u => u.id === c.userId);
                            const canDelComment = (c.userId === db.currentUser.id || this.isAdmin());
                            const delBtn = canDelComment ? `<i class="fas fa-times c-delete" onclick="app.deleteComment(${post.id}, ${c.id})"></i>` : '';
                            
                            let repliesHtml = '';
                            if (c.replies && c.replies.length > 0) {
                                totalComments += c.replies.length;
                                c.replies.forEach(r => {
                                    const rAuthor = db.users.find(u => u.id === r.userId);
                                    const canDelReply = (r.userId === db.currentUser.id || this.isAdmin());
                                    const delReplyBtn = canDelReply ? `<i class="fas fa-times r-delete" onclick="app.deleteReply(${post.id}, ${c.id}, ${r.id})"></i>` : '';
                                    
                                    repliesHtml += `
                                        <div class="reply-item">
                                            <img src="${rAuthor.avatar}" class="reply-avatar">
                                            <div class="reply-bubble">
                                                <div class="reply-header">
                                                    <span class="r-author">${rAuthor.name}</span>
                                                    ${delReplyBtn}
                                                </div>
                                                <div class="r-text">${r.text}</div>
                                            </div>
                                        </div>`;
                                });
                            }
                            
                            const replyInput = `
                                <div class="reply-input-wrapper">
                                    <img src="${db.currentUser.avatar}" class="reply-avatar">
                                    <input type="text" class="r-input" id="input-reply-${c.id}" placeholder="Responder...">
                                    <button class="r-submit" onclick="app.addReply(${post.id}, ${c.id})">Enviar</button>
                                </div>`;
                            
                            const toggleRepliesText = c.replies && c.replies.length > 0 ? 
                                `<div class="toggle-replies" onclick="app.toggleReplies(${c.id})">${c.replies.length} resposta${c.replies.length > 1 ? 's' : ''}</div>` : '';
                            
                            commentsHtml += `
                                <div class="comment-item">
                                    <img src="${cAuthor.avatar}" class="comment-avatar">
                                    <div class="comment-bubble">
                                        <div class="comment-header">
                                            <span class="c-author">${cAuthor.name}</span>
                                            ${delBtn}
                                        </div>
                                        <div class="c-text">${c.text}</div>
                                        <div class="c-actions">
                                            <div class="c-action-btn" onclick="document.getElementById('input-reply-${c.id}').focus()">Responder</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="replies-section" id="replies-${c.id}" style="display: ${c.replies && c.replies.length > 0 ? 'block' : 'none'}">
                                    ${repliesHtml}
                                    ${replyInput}
                                    ${toggleRepliesText}
                                </div>`;
                        });
                    }

                    const mediaContent = post.image ? 
                        `<img src="${post.image}" class="p-image">` : 
                        (post.video ? `<video src="${post.video}" class="p-video" controls></video>` : '');

                    container.innerHTML += `
                        <div class="post">
                            <div class="delete-btn" style="display: ${showDelete}" onclick="app.deletePost(${post.id})"><i class="fas fa-trash"></i></div>
                            <img src="${author.avatar}" class="user-avatar" onclick="nav.goto('profile', ${author.id})">
                            <div class="post-content">
                                <div class="post-header"><span class="p-name">${author.name}</span>${badge}</div>
                                <div class="p-text">${post.text}</div>
                                ${mediaContent}
                                <div class="p-actions">
                                    <div class="act-btn ${isLiked ? 'liked' : ''}" onclick="app.toggleLike(${post.id})"><i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${post.likes.length}</div>
                                    <div class="act-btn" onclick="app.toggleComments(${post.id})"><i class="far fa-comment"></i> ${totalComments}</div>
                                    ${post.image ? `<div class="act-btn" onclick="app.downloadImage('${post.image}')"><i class="fas fa-download"></i></div>` : ''}
                                </div>
                                <div class="comments-section" id="comments-${post.id}">
                                    <div class="comments-header">
                                        <div class="comments-count">${totalComments} comentário${totalComments !== 1 ? 's' : ''}</div>
                                    </div>
                                    <div class="comments-list">
                                        ${commentsHtml}
                                    </div>
                                    <div class="comment-input-wrapper">
                                        <img src="${db.currentUser.avatar}" class="comment-avatar">
                                        <input type="text" class="c-input" id="input-comment-${post.id}" placeholder="Escreva um comentário...">
                                        <button class="c-submit" onclick="app.addComment(${post.id})">Enviar</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            },
            
            searchUsers: function(term) {
                const container = document.getElementById('search-results'); container.innerHTML = '';
                if (!term) return;
                const results = db.users.filter(u => u.name.toLowerCase().includes(term.toLowerCase()));
                results.forEach(u => { 
                    const isFollowing = this.isFollowing(u.id);
                    const followBtn = u.id !== db.currentUser.id ? 
                        `<button class="${isFollowing ? 'unfollow-btn' : 'follow-btn'}" onclick="app.toggleFollow(${u.id})">${isFollowing ? 'Seguindo' : 'Seguir'}</button>` : '';
                    
                    container.innerHTML += `
                        <div class="user-row" onclick="nav.goto('profile', ${u.id})">
                            <img src="${u.avatar}" class="user-avatar">
                            <div style="flex: 1;">
                                <div class="p-name">${u.name} ${u.isAdmin ? '<i class="fas fa-crown admin-badge"></i>' : ''}</div>
                                <div style="color: var(--text-gray); font-size: 0.9rem;">${u.email}</div>
                            </div>
                            ${followBtn}
                        </div>`; 
                });
            }
        };

        // --- NAV ---
        const nav = {
            goto: function(pageName, param = null) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                
                if (pageName === 'home') {
                    document.getElementById('home-page').classList.add('active'); 
                    document.querySelectorAll('.nav-item')[0].classList.add('active');
                    document.getElementById('page-title').innerText = "Início"; 
                    app.renderFeed();
                } else if (pageName === 'search') {
                    document.getElementById('search-page').classList.add('active'); 
                    document.querySelectorAll('.nav-item')[1].classList.add('active');
                    document.getElementById('page-title').innerText = "Buscar";
                } else if (pageName === 'profile') {
                    document.getElementById('profile-page').classList.add('active'); 
                    if(param === db.currentUser.id) document.querySelectorAll('.nav-item')[2].classList.add('active');
                    document.getElementById('page-title').innerText = "Perfil"; 
                    this.renderProfile(param);
                } else if (pageName === 'edit-profile') {
                    document.getElementById('edit-profile-page').classList.add('active'); 
                    document.getElementById('page-title').innerText = "Editar Perfil";
                } else if (pageName === 'admin') {
                    if (!app.isAdmin()) return;
                    document.getElementById('admin-page').classList.add('active'); 
                    document.getElementById('page-title').innerText = "Admin";
                    app.renderAdminPanel();
                }
            },
            
            renderProfile: function(userId) {
                const user = db.users.find(u => u.id === userId);
                const isMe = userId === db.currentUser.id;
                
                const postsCount = db.posts.filter(p => p.userId === userId).length;
                const followersCount = user.followers.length;
                const followingCount = user.following.length;
                
                let actionBtn = '';
                if (isMe) {
                    actionBtn = `<button class="edit-profile-btn" onclick="app.openEditProfile()">Editar Perfil</button>`;
                } else {
                    const isFollowing = app.isFollowing(userId);
                    actionBtn = `<button class="${isFollowing ? 'unfollow-btn' : 'follow-btn'}" onclick="app.toggleFollow(${userId})">${isFollowing ? 'Seguindo' : 'Seguir'}</button>`;
                }
                
                document.getElementById('profile-content').innerHTML = `
                    <div class="profile-header">
                        <img src="${user.avatar}" class="big-avatar">
                        <div style="margin-top:10px;">
                            <div class="p-name" style="font-size:1.3rem;">${user.name} ${user.isAdmin ? '<i class="fas fa-crown admin-badge"></i>' : ''}</div>
                            <div style="color:var(--text-gray)">${user.email}</div>
                        </div>
                        <div class="stats-row">
                            <div class="stat">
                                <span class="stat-number">${postsCount}</span>
                                <span class="stat-label">Postagens</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number">${followersCount}</span>
                                <span class="stat-label">Seguidores</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number">${followingCount}</span>
                                <span class="stat-label">Seguindo</span>
                            </div>
                        </div>
                        <div style="margin-top:10px">${actionBtn}</div>
                    </div>`;
                    
                const postContainer = document.getElementById('profile-posts'); 
                postContainer.innerHTML = '';
                const userPosts = db.posts.filter(p => p.userId === userId);
                
                if (userPosts.length === 0) {
                    postContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-gray);">Nenhuma postagem ainda</div>';
                } else {
                    userPosts.forEach(p => {
                        const mediaContent = p.image ? 
                            `<img src="${p.image}" class="p-image">` : 
                            (p.video ? `<video src="${p.video}" class="p-video" controls></video>` : '');
                            
                        postContainer.innerHTML += `
                            <div class="post">
                                <div class="p-text">${p.text}</div>
                                ${mediaContent}
                                <div class="p-actions">
                                    <div class="act-btn"><i class="far fa-heart"></i> ${p.likes.length}</div>
                                    <div class="act-btn"><i class="far fa-comment"></i> ${p.comments ? p.comments.length : 0}</div>
                                </div>
                            </div>`;
                    });
                }
            }
        };

        db.init(); 
        auth.checkSession();
    </script>
</body>
</html>
